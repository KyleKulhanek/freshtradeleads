[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "freshtradeleads"
version = "0.1.0"
description = "CSLB contractor lead-report ingestion, query, and export engine"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kyle Kulhanek" }]
requires-python = ">=3.11"
keywords = ["cslb", "contractors", "etl", "lead-generation", "open-data"]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "openpyxl>=3.1,<4",
  "XlsxWriter>=3.2,<4",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "Jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "stripe>=12,<14",
  "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.28,<1"]

[project.scripts]
freshtradeleads = "freshtradeleads.cli:main"
freshtradeleads-web = "freshtradeleads.web:run"
freshtradeleads-campaign-report = "freshtradeleads.campaign_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freshtradeleads = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
